name: Build DJ Studio RB for macOS High Sierra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'scripts/**'
      - 'requirements-stems.txt'
      - 'Instalar STEMS.command'
      - 'README-STEMS-AUTO-INSTALL.md'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Intel app for macOS 10.13+
    runs-on: macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build application
        run: cmake --build build --config Release --parallel 2

      - name: Package macOS app as ZIP
        run: |
          APP_PATH="build/DJStudioRB_artefacts/Release/DJ Studio RB.app"
          test -d "$APP_PATH"
          mkdir -p dist/package
          cp -R "$APP_PATH" dist/package/
          mkdir -p dist/package/scripts
          cp scripts/stems.py scripts/install_stems_macos.sh dist/package/scripts/
          cp requirements-stems.txt "Instalar STEMS.command" README-STEMS-AUTO-INSTALL.md dist/package/
          chmod +x dist/package/"Instalar STEMS.command" dist/package/scripts/install_stems_macos.sh
          # Include the app and the first-run STEMS installer in one distributable ZIP.
          ditto -c -k --sequesterRsrc --keepParent dist/package \
            "dist/DJ-Studio-RB-macOS-Intel.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Studio-RB-macOS-High-Sierra
          path: dist/DJ-Studio-RB-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 14
